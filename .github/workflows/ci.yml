name: CI

on:
  pull_request:
  push:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: craft-ai-backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: craft-ai-backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  fabric:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: craft-ai-mod
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: craftai-fabric-mod
          path: craft-ai-mod/build/libs/
